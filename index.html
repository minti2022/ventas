<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Ventas</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; max-width: 1000px; margin: auto; }
    h1 { text-align: center; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .tarjeta { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .tarjeta:hover { transform: translateY(-5px); }
    .tarjeta img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background: #eee; }
    .tarjeta h3 { margin: 12px 0 6px; color: #222; }
    .precio { color: #2e7d32; font-weight: bold; font-size: 1.2em; margin: 0; }
    #estado { text-align: center; color: #666; }
  </style>
</head>
<body>

  <h1>Mi Catálogo de Ventas</h1>
  <p id="estado">Cargando productos...</p>
  <div id="catalogo" class="grid"></div>

  <script>
    const libreria = document.createElement('script');
    libreria.src = 'https://jsdelivr.net' + '/npm/@supabase' + '/supabase-js@2';
    
    libreria.onload = async function() {
      const supabaseUrl = 'https://supabase.co';
      const supabaseKey = 'sb_publishable_wWN3B681YrWGAmWUR8EZTw_JLxzq72s';
      const baseDeDatos = window.supabase.createClient(supabaseUrl, supabaseKey);

      const contenedor = document.getElementById('catalogo');
      const mensajeEstado = document.getElementById('estado');

      const { data: productos, error } = await baseDeDatos
        .from('productos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        mensajeEstado.textContent = 'Error: ' + error.message;
        return;
      }

      if (!productos || productos.length === 0) {
        mensajeEstado.textContent = 'Aún no hay productos publicados.';
        return;
      }

      mensajeEstado.style.display = 'none';
      contenedor.innerHTML = '';

      productos.forEach(producto => {
        contenedor.innerHTML += `
          <div class="tarjeta">
            <img src="${producto.imagen}" alt="${producto.nombre}">
            <h3>${producto.nombre}</h3>
            <p class="precio">$${producto.precio}</p>
          </div>
        `;
      });
    };

    document.head.appendChild(libreria);
  </script>

</body>
</html>
